<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="IoT smart home with MQTT sensors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e22"/><stop offset="1" stop-color="#05060f"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e57ff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffd166" stop-opacity="0.32"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="230" fill="url(#halo)"/>

  <!-- wifi arcs -->
  <g transform="translate(400 250)" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round">
    <path d="M-70 -70 A99 99 0 0 1 70 -70" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M-40 -40 A56 56 0 0 1 40 -40" opacity="0.7"/>
    <circle r="6" fill="#00e5ff" stroke="none"/>
  </g>

  <!-- house -->
  <g transform="translate(400 300)" fill="none" stroke="url(#gv)" stroke-width="3.2" stroke-linejoin="round">
    <path d="M-90 0 L0 -80 L90 0"/>
    <path d="M-70 8 V90 H70 V8"/>
    <rect x="-24" y="40" width="48" height="50"/>
    <rect x="28" y="40" width="30" height="30" stroke="#ffd166"/>
  </g>

  <!-- connected devices -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.4">
    <path d="M310 300 H150M490 300 H650M400 210 V110"/>
  </g>
  <g fill="#0b0e22" stroke="#00e5ff" stroke-width="2">
    <circle cx="150" cy="300" r="10"/><circle cx="650" cy="300" r="10"/>
  </g>
  <g fill="#0b0e22" stroke="#ffd166" stroke-width="2">
    <rect x="386" y="90" width="28" height="28" rx="6"/>
  </g>

  <g font-family="monospace" font-size="14" fill="#9aa1c7">
    <text x="110" y="336">sensor</text>
    <text x="620" y="336">switch</text>
    <text x="368" y="82">hub</text>
  </g>
  <g fill="#00e5ff">
    <circle cx="180" cy="150" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="170" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="400" y="460" font-family="monospace" font-size="21" text-anchor="middle" fill="#9aa1c7">Raspberry Pi · MQTT · Flask · SQLite</text>
</svg>
