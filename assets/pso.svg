<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Particle swarm optimization converging on a minimum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e22"/><stop offset="1" stop-color="#05060f"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e57ff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffd166" stop-opacity="0.45"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- contour field -->
  <g transform="translate(400 250)" fill="none" stroke="url(#gv)" stroke-width="1.4" opacity="0.55">
    <ellipse rx="300" ry="180"/><ellipse rx="240" ry="140"/><ellipse rx="180" ry="104"/><ellipse rx="120" ry="68"/><ellipse rx="60" ry="34"/>
  </g>
  <circle cx="400" cy="250" r="140" fill="url(#halo)"/>

  <!-- global best -->
  <g transform="translate(400 250)">
    <circle r="10" fill="#ffd166"><animate attributeName="r" values="8;13;8" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle r="22" fill="none" stroke="#ffd166" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="12;34;12" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- particles with velocity -->
  <g fill="#00e5ff">
    <circle cx="180" cy="150" r="6"><animate attributeName="cx" values="180;330;360" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="150;210;250" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="180" r="6"><animate attributeName="cx" values="640;470;430" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="180;240;252" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="360" r="6"><animate attributeName="cx" values="620;470;420" dur="7.6s" repeatCount="indefinite"/><animate attributeName="cy" values="360;300;258" dur="7.6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="370" r="6"><animate attributeName="cx" values="200;340;386" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="370;310;255" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ff4ecd">
    <circle cx="300" cy="90" r="5"><animate attributeName="cx" values="300;380;398" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="90;180;248" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="400" r="5"><animate attributeName="cx" values="520;430;402" dur="8.4s" repeatCount="indefinite"/><animate attributeName="cy" values="400;320;252" dur="8.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="400" y="452" font-family="monospace" font-size="21" text-anchor="middle" fill="#ffd166">Swarm intelligence · global best convergence</text>
</svg>
