<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Agentic AI knowledge graph with an assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e22"/><stop offset="1" stop-color="#05060f"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e57ff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#6e57ff" stop-opacity="0.55"/><stop offset="1" stop-color="#6e57ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.5"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>
  <circle cx="370" cy="250" r="230" fill="url(#halo)"/>
  <circle cx="620" cy="120" r="150" fill="url(#halo2)"/>

  <g stroke="url(#gv)" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <path d="M370 250 L180 150M370 250 L200 370M370 250 L560 150M370 250 L600 360M370 250 L370 90M370 250 L150 260M370 250 L560 250M180 150 L120 90M560 150 L640 70M200 370 L120 430M600 360 L690 420"/>
  </g>

  <g fill="#0b0e22" stroke="url(#gv)" stroke-width="2">
    <circle cx="180" cy="150" r="10"/><circle cx="200" cy="370" r="10"/>
    <circle cx="560" cy="150" r="12"/><circle cx="600" cy="360" r="10"/>
    <circle cx="370" cy="90" r="9"/><circle cx="150" cy="260" r="11"/>
    <circle cx="560" cy="250" r="9"/><circle cx="120" cy="90" r="7"/>
    <circle cx="640" cy="70" r="7"/><circle cx="120" cy="430" r="7"/><circle cx="690" cy="420" r="7"/>
  </g>

  <circle cx="370" cy="250" r="66" fill="url(#halo)" filter="url(#soft)"/>
  <circle cx="370" cy="250" r="40" fill="url(#gv)">
    <animate attributeName="r" values="38;44;38" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="250" r="40" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="40;70;40" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M356 250l9 9 20-22" fill="none" stroke="#05060f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(560 250)">
    <rect x="0" y="-46" width="180" height="92" rx="16" fill="rgba(10,12,30,0.92)" stroke="url(#gv)" stroke-width="1.6"/>
    <path d="M20 46 L20 66 L44 46 Z" fill="rgba(10,12,30,0.92)" stroke="url(#gv)" stroke-width="1.6"/>
    <g fill="#b9aefc">
      <rect x="20" y="-24" width="120" height="8" rx="4" opacity="0.9"/>
      <rect x="20" y="-6" width="140" height="8" rx="4" opacity="0.6"/>
      <rect x="20" y="12" width="90" height="8" rx="4" opacity="0.75"/>
    </g>
  </g>

  <g fill="#00e5ff">
    <circle cx="120" cy="90" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="420" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="70" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
