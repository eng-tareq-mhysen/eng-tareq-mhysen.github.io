<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="BART abstractive text summarization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e22"/><stop offset="1" stop-color="#05060f"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e57ff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#6e57ff" stop-opacity="0.35"/><stop offset="1" stop-color="#6e57ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="230" fill="url(#halo)"/>

  <!-- long document -->
  <g transform="translate(70 110)">
    <rect width="230" height="280" rx="14" fill="rgba(10,12,30,0.85)" stroke="#ffffff" stroke-opacity="0.12"/>
    <g fill="#9aa1c7" opacity="0.75">
      <rect x="22" y="30" width="186" height="8" rx="4"/>
      <rect x="22" y="52" width="150" height="8" rx="4"/>
      <rect x="22" y="74" width="176" height="8" rx="4"/>
      <rect x="22" y="96" width="120" height="8" rx="4"/>
      <rect x="22" y="118" width="170" height="8" rx="4"/>
      <rect x="22" y="140" width="140" height="8" rx="4"/>
      <rect x="22" y="162" width="182" height="8" rx="4"/>
      <rect x="22" y="184" width="110" height="8" rx="4"/>
      <rect x="22" y="206" width="168" height="8" rx="4"/>
      <rect x="22" y="228" width="130" height="8" rx="4"/>
      <rect x="22" y="250" width="158" height="8" rx="4"/>
    </g>
  </g>

  <!-- transformer/arrow -->
  <g transform="translate(400 250)" fill="none" stroke="url(#gv)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-50 0 H40"/>
    <path d="M26 -15 L46 0 L26 15"/>
  </g>
  <g transform="translate(400 175)">
    <rect x="-60" y="-30" width="120" height="60" rx="12" fill="rgba(10,12,30,0.9)" stroke="url(#gv)" stroke-width="1.6"/>
    <text x="0" y="6" font-family="monospace" font-size="20" text-anchor="middle" fill="#00e5ff">BART</text>
  </g>

  <!-- summary -->
  <g transform="translate(500 150)">
    <rect width="230" height="200" rx="14" fill="rgba(10,12,30,0.85)" stroke="url(#gv)" stroke-width="2"/>
    <g fill="#b9aefc">
      <rect x="22" y="40" width="186" height="12" rx="6"/>
      <rect x="22" y="72" width="160" height="12" rx="6"/>
      <rect x="22" y="104" width="182" height="12" rx="6"/>
      <rect x="22" y="136" width="120" height="12" rx="6"/>
    </g>
  </g>

  <text x="400" y="460" font-family="monospace" font-size="21" text-anchor="middle" fill="#9aa1c7">Abstractive summarization · Hugging Face · Streamlit</text>
</svg>
