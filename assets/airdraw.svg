<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="AI air drawing with hand tracking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e22"/><stop offset="1" stop-color="#05060f"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e57ff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.4"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="420" cy="240" r="220" fill="url(#halo)"/>

  <!-- drawn spiral -->
  <path d="M420 240 C470 210 520 250 500 300 C470 360 380 360 340 300 C300 230 360 150 450 150 C560 150 620 250 580 350"
        fill="none" stroke="url(#gv)" stroke-width="6" stroke-linecap="round"/>
  <path d="M420 240 C470 210 520 250 500 300 C470 360 380 360 340 300 C300 230 360 150 450 150 C560 150 620 250 580 350"
        fill="none" stroke="#00e5ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 10" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-56" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- hand landmarks -->
  <g transform="translate(250 300)" stroke="url(#gv)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0 0 L-40 -10 L-70 -40"/>
    <path d="M0 0 L-10 -60 L-5 -100"/>
    <path d="M10 0 L30 -60 L40 -95"/>
    <path d="M22 4 L60 -40 L78 -70"/>
    <path d="M-6 20 L-40 40 L-70 30"/>
  </g>
  <g transform="translate(250 300)" fill="#ff4ecd">
    <circle cx="0" cy="0" r="6"/><circle cx="-40" cy="-10" r="4"/><circle cx="-70" cy="-40" r="4"/>
    <circle cx="-10" cy="-60" r="4"/><circle cx="-5" cy="-100" r="4"/><circle cx="30" cy="-60" r="4"/>
    <circle cx="40" cy="-95" r="4"/><circle cx="60" cy="-40" r="4"/><circle cx="78" cy="-70" r="4"/>
    <circle cx="-40" cy="40" r="4"/><circle cx="-70" cy="30" r="4"/>
  </g>

  <g transform="translate(580 350)">
    <circle r="12" fill="#00e5ff"><animate attributeName="r" values="10;16;10" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="22" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="14;30;14" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="400" y="460" font-family="monospace" font-size="21" text-anchor="middle" fill="#9aa1c7">21 hand landmarks · OpenCV + MediaPipe</text>
</svg>
